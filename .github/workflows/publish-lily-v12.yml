name: Publish LILY V121

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified prebuilt artifacts
        env:
          FW_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-22f0-81f5-a561-1efbe944fc6e/raw?se=2026-09-03T15%3A46%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=22648b8f-f058-5d77-a7b8-1f9d03374324&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T15%3A32%3A37Z&ske=2026-09-04T15%3A32%3A37Z&sks=b&skv=2026-02-06&sig=EmczACAZ0clxozMx5qtNMnDKjD0izXsKJkmWeh3yMJM%3D'
          APP_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8f54-81f5-a2c6-45d9d3b22028/raw?se=2026-09-03T15%3A47%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=d90ac73e-63de-5d3c-bab4-3c9f769e3715&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T15%3A28%3A01Z&ske=2026-09-04T15%3A28%3A01Z&sks=b&skv=2026-02-06&sig=PFZb9IyyyWNSzWiZ8%2BqPiSvtQsVPUE3XJKOoFiRC/uY%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$FW_URL" -o firmware_artifact.zip
          curl --fail --location --retry 3 "$APP_URL" -o apk_artifact.zip
          unzip -q firmware_artifact.zip -d fw
          unzip -q apk_artifact.zip -d app
          test -s fw/firmware.bin
          test -s fw/bootloader.bin
          test -s fw/partitions.bin
          test -s app/LILY_Scanner_v1.2.apk

      - name: Assemble LILY V121 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cp fw/firmware.bin package/FW.bin
          cp fw/bootloader.bin package/bootloader.bin
          cp fw/partitions.bin package/partitions.bin
          cp app/LILY_Scanner_v1.2.apk package/APP.apk
          cat > package/UPLOAD_COM6.bat <<'BAT'
          @echo off
          setlocal
          cd /d "%~dp0"
          set PORT=COM6
          set PY=python
          if exist "%USERPROFILE%\.platformio\penv\Scripts\python.exe" set PY=%USERPROFILE%\.platformio\penv\Scripts\python.exe
          echo ================================================
          echo LILY Scanner v1.2.1 HTTP CORE0 - FW UPDATE - %PORT%
          echo ================================================
          "%PY%" -m esptool --chip esp32 --port %PORT% --baud 921600 write_flash 0x10000 FW.bin
          if errorlevel 1 (
            echo.
            echo NAPAKA pri nalaganju.
            pause
            exit /b 1
          )
          echo.
          echo KONCANO.
          pause
          BAT
          cat > package/README.txt <<'TXT'
          LILY Scanner FW v1.2.1 HTTP CORE0

          APP.apk            Android aplikacija v1.2 (ostane ista)
          FW.bin             Firmware v1.2.1 za LILYGO T3 V1.6.1 / SX1276
          UPLOAD_COM6.bat    Posodobitev firmwarea na COM6
          bootloader.bin     ESP32 bootloader
          partitions.bin     Partition tabela

          WiFi: WaterMeter-Scanner
          Geslo: scanner868

          POPRAVEK v1.2.1:
          - HTTP/API tece v lastni FreeRTOS nalogi na CORE 0
          - RF scanner ostane na CORE 1
          - aplikacija mora ostati dosegljiva tudi med T1/C1 skeniranjem
          - /api/status vrne version=1.2.1-HTTP-CORE0, apiCore=0, scannerCore=1

          Scanner uporablja preverjene profile okoli 868.950 MHz:
          - T1 PRIOR/P2
          - T1 WMBUS_DIRECT
          - C1-A hardware DCLK

          Iskanje ni vezano na znane ID-je.
          TXT
          (cd package && sha256sum APP.apk FW.bin bootloader.bin partitions.bin > SHA256SUMS.txt)
          (cd package && zip -q ../LILY_V121.zip APP.apk FW.bin UPLOAD_COM6.bat README.txt SHA256SUMS.txt bootloader.bin partitions.bin)
          unzip -t LILY_V121.zip
          sha256sum LILY_V121.zip

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.2.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.2.1 LILY_V121.zip \
            --target "$GITHUB_SHA" \
            --title 'LILY Scanner v1.2.1 - HTTP Core0' \
            --notes 'Popravek nedosegljivosti med skeniranjem: HTTP/API je locen na core 0, RF scanner ostane na core 1. APK ostane v1.2.'
